events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format ha_combined '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" upstream: $upstream_addr '
                            'time: $upstream_response_time status: $upstream_status';

    access_log /var/log/nginx/access.log ha_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream simed_ha_upstream {
        # Primary: SIMED Server RS (Windows ANTRIAN 1 via Tailscale)
        server 100.117.70.113:3008 max_fails=2 fail_timeout=5s;
        
        # Backup: Home Server Local (Automatic Failover)
        server 127.0.0.1:3008 backup;
    }

    server {
        listen 3009;
        listen 3006;
        server_name _;

        client_max_body_size 50M;

        location / {
            proxy_pass http://simed_ha_upstream;
            proxy_http_version 1.1;
            
            # WebSocket & Server-Sent Events (SSE) support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fast Failover Timers (Sub-second recovery)
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 4s;

            # Real-time streaming
            proxy_buffering off;
            proxy_cache off;

            # Debug HA Header
            add_header X-SIMED-HA-Upstream $upstream_addr always;
            add_header X-SIMED-HA-Status $upstream_status always;
        }
    }
}
