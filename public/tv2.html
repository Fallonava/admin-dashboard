<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jadwal Dokter - Swiss Medical Grid (Linear Light 2026)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <style>
      .material-icons-round {
        font-family: "Material Icons Round"; font-weight: normal; font-style: normal; font-size: 20px;
        display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal; word-wrap: normal;
        white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased;
      }

      :root {
        --bg-body: #F8FAFC;
        --card-bg: #FFFFFF;
        --card-border: #E2E8F0;
        --border-light: #E2E8F0;
        
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;

        --accent-blue: #0284C7;
        --accent-purple: #7C3AED;
        --accent-green: #059669;
        --accent-orange: #EA580C;
        --accent-amber: #D97706;
        --accent-red: #E11D48;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        font-family: "Inter", sans-serif;
        background: #F8FAFC; color: var(--text-primary);
        user-select: none; cursor: none;
      }

      .ambient-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35;
        background-image: radial-gradient(rgba(15, 23, 42, 0.09) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .app-container {
        position: relative; z-index: 1; width: 100%; height: 100%;
        display: flex; flex-direction: column; padding: clamp(8px, 1.2vw, 16px); gap: clamp(8px, 1vw, 14px);
      }

      .content { flex: 1; display: flex; gap: clamp(10px, 1.2vw, 16px); min-height: 0; }

      .island {
        display: flex; flex-direction: column;
        background: #FFFFFF; border-radius: clamp(10px, 1.2vw, 16px); border: 1px solid var(--card-border);
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        overflow: hidden; position: relative;
      }

      .sidebar-panel { flex: 0 0 clamp(260px, 23vw, 340px); max-width: 360px; min-width: 260px; }
      
      .header {
        padding: clamp(10px, 1.2vw, 16px) clamp(12px, 1.4vw, 18px); display: flex; align-items: flex-start; gap: 12px;
        border-bottom: 1px solid var(--card-border);
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .logo-box {
        width: clamp(34px, 2.8vw, 42px); height: clamp(34px, 2.8vw, 42px); border-radius: 8px; background: #FFFFFF;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--card-border); overflow: hidden;
      }
      .logo-box img { width: 85%; height: 85%; object-fit: contain; }
      .title-group h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(12px, 1.1vw, 15px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; color: #0F172A; }
      .title-group span { font-family: "JetBrains Mono", monospace; font-size: clamp(8.5px, 0.75vw, 10px); font-weight: 700; color: var(--accent-blue); text-transform: uppercase; }

      .stat-panel {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--card-border);
        border-bottom: 1px solid var(--card-border);
      }
      .stat-item {
        background: #FFFFFF; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .stat-count { font-family: "JetBrains Mono", monospace; font-size: clamp(18px, 1.6vw, 24px); font-weight: 800; line-height: 1; }
      .stat-label { font-family: "JetBrains Mono", monospace; font-size: clamp(8px, 0.7vw, 9.5px); font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

      .clock { font-family: "JetBrains Mono", monospace; font-size: clamp(20px, 2vw, 32px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: var(--accent-blue); }
      .date { font-family: "JetBrains Mono", monospace; font-size: clamp(9px, 0.75vw, 11px); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; text-align: right; line-height: 1.3; }

      .island-header {
        height: clamp(40px, 3.5vw, 48px); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(12px, 1.4vw, 18px);
        flex-shrink: 0; border-bottom: 1px solid var(--card-border); background: #F8FAFC;
      }
      .island-title { font-family: "Space Grotesk", sans-serif; font-size: clamp(11.5px, 1vw, 14px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #0F172A; }
      .island-badge {
        font-family: "JetBrains Mono", monospace; font-size: clamp(9.5px, 0.8vw, 11.5px); font-weight: 800; padding: 2px 8px; border-radius: 4px;
        background: #EFF6FF; border: 1px solid #BFDBFE; color: var(--accent-blue);
      }

      .scroll-mask { flex: 1; overflow: hidden; position: relative; }
      .scroller { padding: clamp(8px, 1vw, 14px); display: flex; flex-direction: column; gap: clamp(6px, 0.8vw, 10px); }

      .platter {
        display: flex; flex-direction: column; padding: clamp(8px, 1vw, 14px) clamp(10px, 1.2vw, 16px);
        background: #FFFFFF; border-radius: clamp(8px, 0.9vw, 12px); border: 1px solid var(--card-border);
        position: relative; overflow: hidden; transition: all 0.25s ease;
      }
      .platter::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        background: var(--status-color, var(--accent-blue));
      }

      .platter-main { display: flex; align-items: center; gap: clamp(8px, 1vw, 12px); width: 100%; }
      .initials {
        width: clamp(30px, 2.6vw, 38px); height: clamp(30px, 2.6vw, 38px); border-radius: 6px; background: #F8FAFC;
        border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center;
        font-family: "JetBrains Mono", monospace; font-size: clamp(11px, 0.95vw, 13px); font-weight: 800;
        color: var(--status-color, #0F172A); flex-shrink: 0;
      }
      .info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .doc-spec { font-family: "Space Grotesk", sans-serif; font-size: clamp(12.5px, 1.1vw, 15.5px); font-weight: 700; color: #0F172A; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.15; }
      .doc-name {
        font-size: clamp(10.5px, 0.9vw, 12.5px); font-weight: 500; color: var(--text-secondary);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;
      }
      .meta-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
      .status-pill {
        font-family: "JetBrains Mono", monospace; padding: 3px 8px; border-radius: 4px; font-size: clamp(8px, 0.7vw, 10px); font-weight: 800; text-transform: uppercase;
        background: var(--status-bg, #F1F5F9); border: 1px solid var(--status-color, var(--card-border));
        color: var(--status-color, #0F172A); display: flex; align-items: center; gap: 4px;
      }
      .jam-val { font-family: "JetBrains Mono", monospace; font-size: clamp(11px, 0.95vw, 13.5px); font-weight: 700; color: #0F172A; }

      /* ACTIVE HERO CARD */
      .platter.active {
        background: #F0FDF4 !important; border-color: #86EFAC !important;
        border-left: 5px solid #059669 !important;
        box-shadow: 0 4px 16px rgba(5, 150, 105, 0.1) !important;
      }
      .platter.active .doc-spec { font-size: clamp(14px, 1.2vw, 17px); color: #0F172A !important; }
      .platter.active .doc-name { color: var(--status-color) !important; font-weight: 600; }

      .platter-detail {
        max-height: 0; opacity: 0; overflow: hidden; transition: all 0.35s ease;
        border-top: 1px solid transparent; margin-top: 0; padding-top: 0;
      }
      .platter.active .platter-detail {
        max-height: 70px; opacity: 1; margin-top: 8px; padding-top: 8px;
        border-top: 1px dashed rgba(0, 0, 0, 0.1); display: flex; justify-content: space-between; align-items: center;
      }
      .detail-label { font-family: "JetBrains Mono", monospace; font-size: clamp(8px, 0.7vw, 9.5px); font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
      .detail-time { font-family: "JetBrains Mono", monospace; font-size: clamp(12.5px, 1.1vw, 15.5px); font-weight: 800; color: #0F172A; }
      .live-status {
        display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 4px;
        background: rgba(5, 150, 105, 0.12); border: 1px solid #059669;
        color: #059669; font-family: "JetBrains Mono", monospace; font-size: clamp(8.5px, 0.75vw, 10.5px); font-weight: 800; text-transform: uppercase;
      }
      .pulse-dot {
        width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; animation: pulse-bionic 1.5s infinite;
      }
      @keyframes pulse-bionic { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

      .sidebar-panel .platter { padding: 6px 8px; margin: 3px 5px; border-radius: 6px; }
      .sidebar-panel .initials { width: 26px; height: 26px; font-size: 10.5px; }
      .sidebar-panel .doc-name { font-size: 11px; font-weight: 600; color: #0F172A; }
      .sidebar-panel .doc-spec { font-size: 9px; color: var(--text-muted); }

      .footer {
        height: clamp(38px, 3.5vw, 48px); background: #FFFFFF; border-radius: 8px;
        border: 1px solid var(--card-border); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(10px, 1.2vw, 16px); flex-shrink: 0;
      }
      .legend { display: flex; gap: clamp(8px, 1vw, 12px); padding-right: 12px; border-right: 1px solid var(--card-border); }
      .lg-item { display: flex; align-items: center; gap: 4px; font-family: "JetBrains Mono", monospace; font-size: clamp(8.5px, 0.75vw, 10.5px); font-weight: 700; color: var(--text-secondary); }
      .dot { width: 6px; height: 6px; border-radius: 2px; }
      .ticker { flex: 1; margin: 0 clamp(10px, 1.2vw, 16px); overflow: hidden; position: relative; }
      .ticker-inner {
        white-space: nowrap; animation: marquee 30s linear infinite; font-family: "Inter", sans-serif; font-size: clamp(10.5px, 0.9vw, 12.5px); font-weight: 600; color: #0F172A;
      }
      @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
      .status-pill-lg {
        display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px;
        background: #F0FDF4; border: 1px solid #86EFAC;
        font-family: "JetBrains Mono", monospace; font-size: clamp(8.5px, 0.75vw, 10.5px); font-weight: 800; color: #059669;
      }
      .live-dot { width: 6px; height: 6px; border-radius: 2px; background: #059669; }

      .dynamic-island {
        position: absolute; top: 14px; left: 50%; transform: translateX(-50%) scale(0); height: 46px;
        background: #0F172A; border-radius: 8px; z-index: 999; display: flex; align-items: center; justify-content: center;
        transition: all 0.35s ease; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); opacity: 0;
      }
      .dynamic-island.expanded { transform: translateX(-50%) scale(1); opacity: 1; min-width: 300px; padding: 0 16px; }
      .di-content { display: flex; align-items: center; gap: 10px; }
      .di-spinner { width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.2); border-top: 2px solid #059669; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .di-title { font-size: 9px; font-weight: 700; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; }
      .di-msg { font-size: 11.5px; font-weight: 600; color: #FFF; }

      .st-praktek { --status-color: #059669; --status-bg: #ECFDF5; }
      .st-pendaftaran { --status-color: #EA580C; --status-bg: #FFF7ED; }
      .st-terjadwal { --status-color: #0284C7; --status-bg: #F0F9FF; }
      .st-penuh { --status-color: #D97706; --status-bg: #FFFBEB; }
      .st-operasi { --status-color: #7C3AED; --status-bg: #F5F3FF; }
      .st-cuti { --status-color: #E11D48; --status-bg: #FFF1F2; }
      .st-selesai { --status-color: #64748B; --status-bg: #F8FAFC; }
      .st-libur { display: none; }
      .st-buka { --status-color: #059669; --status-bg: #ECFDF5; }
      .st-buka.st-terjadwal { --status-color: #0284C7; --status-bg: #F0F9FF; }

      /* Smart TV / 960x540 / 720p Responsive */
      @media (max-width: 1024px), (max-height: 600px) {
        .app-container { gap: 6px; padding: 6px 10px 10px 10px; }
        .header { padding: 8px 10px 6px; gap: 8px; }
        .sidebar-panel { flex: 0 0 235px; min-width: 215px; }
        .clock { font-size: 18px !important; }
        .platter { padding: 6px 8px; border-radius: 6px; gap: 4px; }
        .initials { width: 26px; height: 26px; font-size: 10px; }
        .doc-spec { font-size: 11.5px; }
        .doc-name { font-size: 10px; }
        .jam-val { font-size: 11px; }
        .footer { height: 36px; padding: 0 10px; }
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        html, body { overflow-y: auto !important; height: auto !important; }
        .app-container { height: auto !important; min-height: 100vh; flex-direction: column; overflow: visible; }
        .content { flex-direction: column; height: auto !important; overflow: visible; }
        .sidebar-panel { flex: none; width: 100%; max-width: none; }
        .island { flex: none; height: auto !important; overflow: visible; }
        .scroll-mask { overflow: visible; height: auto !important; mask-image: none !important; }
        .scroller { overflow: visible; transform: none !important; }
        .footer { position: sticky; bottom: 8px; z-index: 100; }
      }
    </style>
  </head>
<body>
    <!-- DYNAMIC ISLAND PRE-MOUNT -->
    <div id="dynamicIsland" class="dynamic-island">
      <div class="di-content">
        <div id="diIcon" class="di-spinner"></div>
        <div class="di-text">
          <span id="diTitle" class="di-title">System</span>
          <span id="diMsg" class="di-msg">Loading...</span>
        </div>
      </div>
    </div>
    <div class="ambient-bg"></div>

    <!-- EMERGENCY BROADCAST OVERLAY -->
    <div id="broadcastOverlay" class="broadcast-overlay">
      <div class="broadcast-backdrop"></div>
      <div class="broadcast-panel">
        <div class="broadcast-icon-ring">
          <span class="material-icons-round">campaign</span>
        </div>
        <div id="broadcastLevelLabel" class="broadcast-level-label">
          INFORMATION
        </div>
        <div id="broadcastMessage" class="broadcast-message">—</div>
        <div id="broadcastZone" class="broadcast-zone">All Zones</div>
      </div>
    </div>
    <div class="app-container">
      <!-- Content -->
      <main class="content">
        <!-- Sidebar (Left - Integrated Header) -->
        <aside class="island sidebar-panel">
          <!-- Header Component (Optimized) -->
          <div class="header" style="margin-bottom: 0; padding-bottom: 12px">
            <div class="brand">
              <div class="logo-box" style="width: 36px; height: 36px">
                <img src="/logo-rs.png" alt="RSU Siaga Medika Logo" />
              </div>
              <div class="title-group">
                <h1 style="font-size: 14px; line-height: 1.1">
                  RSU SIAGA MEDIKA<br />PURBALINGGA
                </h1>
                <span style="font-size: 9px; margin-top: 2px; display: block"
                  >Antrian Pendaftaran</span
                >
              </div>
            </div>
          </div>

          <!-- Ringkasan Statistik -->
          <div class="stat-panel">
            <div class="stat-item">
              <span
                class="stat-count"
                id="statBuka"
                style="color: var(--accent-green)"
                >0</span
              >
              <span class="stat-label">Buka</span>
            </div>
            <div
              class="stat-item"
              style="
                border-left: 1px solid var(--border-light);
                border-right: 1px solid var(--border-light);
              "
            >
              <span
                class="stat-count"
                id="statPenuh"
                style="color: var(--accent-orange)"
                >0</span
              >
              <span class="stat-label">Penuh</span>
            </div>
            <div class="stat-item">
              <span
                class="stat-count"
                id="statCuti"
                style="color: var(--accent-red)"
                >0</span
              >
              <span class="stat-label">Cuti</span>
            </div>
          </div>

          <!-- Clock & Date (Moved below stats for better vertical flow) -->
          <div
            style="
              padding: 10px 16px;
              border-bottom: 1px solid var(--border-light);
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              background: rgba(0, 0, 0, 0.02);
            "
          >
            <div
              class="clock"
              id="clock"
              style="font-size: 28px; font-weight: 500"
            >
              00:00
            </div>
            <div
              class="date"
              id="date"
              style="
                font-size: 10px;
                opacity: 0.6;
                text-align: right;
                line-height: 1.2;
              "
            >
              -
            </div>
          </div>

          <!-- Sidebar Status List (Penuh/Cuti) -->
          <div
            class="island-header"
            style="
              background: transparent;
              border-bottom: 1px solid var(--border-light);
              padding-top: 0;
              height: 36px;
            "
          >
            <span class="island-title" style="letter-spacing: 1px"
              >Status Khusus</span
            >
            <span class="island-badge" id="countSidebar">0</span>
          </div>

          <div class="scroll-mask" id="maskSidebar">
            <div
              class="scroller"
              id="scrollSidebar"
              style="padding: 10px; gap: 8px"
            ></div>
          </div>

          <!-- Info Cards (Bottom pinned or scroll) -->
          <div
            style="
              padding: 12px 16px;
              border-top: 1px solid var(--border-light);
              background: rgba(0, 0, 0, 0.05);
            "
          >
            <div
              style="
                display: flex;
                gap: 8px;
                align-items: center;
                margin-bottom: 6px;
              "
            >
              <span
                class="material-icons-round"
                style="color: var(--accent-blue); font-size: 16px"
                >info</span
              >
              <span
                style="
                  font-size: 10px;
                  font-weight: 700;
                  text-transform: uppercase;
                  color: var(--text-secondary);
                "
                >Pesan Informasi</span
              >
            </div>
            <p
              id="dynamicInfoBox"
              style="
                font-size: 10px;
                line-height: 1.4;
                color: var(--text-secondary);
                transition: opacity 0.3s ease;
              "
            >
              Memuat informasi terbaru...
            </p>
          </div>


        </aside>

        <!-- Bedah Island -->
        <section class="island">
          <div class="island-header">
            <div
              style="display: flex; align-items: center; gap: 8px; min-width: 0"
            >
              <span
                class="material-icons-round"
                style="font-size: 16px; color: var(--accent-blue); opacity: 0.8"
                >local_hospital</span
              >
              <span class="island-title">Bedah</span>
            </div>
            <span
              class="island-badge"
              id="countBedah"
              style="
                background: rgba(10, 132, 255, 0.15);
                color: var(--accent-blue);
              "
              >0</span
            >
          </div>
          <div class="scroll-mask" id="maskBedah">
            <div class="scroller" id="scrollBedah"></div>
          </div>
        </section>

        <!-- Non Bedah Island -->
        <section class="island">
          <div class="island-header">
            <div
              style="display: flex; align-items: center; gap: 8px; min-width: 0"
            >
              <span
                class="material-icons-round"
                style="
                  font-size: 16px;
                  color: var(--accent-purple);
                  opacity: 0.8;
                "
                >medical_services</span
              >
              <span class="island-title">Non Bedah</span>
            </div>
            <span
              class="island-badge"
              id="countNonBedah"
              style="
                background: rgba(191, 90, 242, 0.15);
                color: var(--accent-purple);
              "
              >0</span
            >
          </div>
          <div class="scroll-mask" id="maskNonBedah">
            <div class="scroller" id="scrollNonBedah"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      // ===== CONFIGURATION =====
      const CFG = {
        API_MAIN: "/api/display",
        POLL_MS: 3000, // Reduced for faster dev/test feedback, can be restored later
        // Scroll Profesional: Item-by-Item
        SCROLL_ITEM_PAUSE: 3000, // Jeda antar item (ms) — waktu baca per kartu
        SCROLL_EDGE_PAUSE: 6000, // Jeda di ujung atas/bawah (ms)
        SCROLL_DURATION: 800, // Durasi animasi geser per item (ms)
      };

      // ===== CORE ENGINE =====
      const $ = (id) => document.getElementById(id);
      const esc = (t) => {
        const d = document.createElement("div");
        d.textContent = t || "";
        return d.innerHTML;
      };
      const initials = (n) =>
        n
          ? n
              .split(" ")
              .map((w) => w[0])
              .join("")
              .slice(0, 2)
              .toUpperCase()
          : "DR";

      const getSpecialistIcon = (spec) => {
        const s = (spec || "").toLowerCase();

      // ===== PROFESSIONAL SCROLLER (Item-by-Item with Easing) =====
      // Pola: Scroll satu item → pause → scroll item berikutnya → ... → sampai bawah → pause lama → fade reset ke atas → ulangi
      class SmoothScroller {
        constructor(id) {
          this.el = $(id);
          this.y = 0;
          this.targetY = 0;
          this.currentItem = 0;
          this.itemOffsets = []; // Posisi Y setiap item (kartu)
          this.active = true;
          this.animating = false;
          this.h = 0; // scrollHeight
          this.vh = 0; // viewportHeight
          this.timer = null;

          window.addEventListener("resize", () => this.updateMetrics());
        }

        // Hitung posisi setiap item kartu
        updateMetrics() {
          if (!this.el) return;
          this.h = this.el.scrollHeight;
          this.vh = this.el.parentElement.clientHeight;

          // Bangun array offset posisi tiap item
          this.itemOffsets = [];
          const children = this.el.children;
          for (let i = 0; i < children.length; i++) {
            this.itemOffsets.push(children[i].offsetTop);
          }

          // Jika konten tidak perlu scroll, reset
          if (this.h <= this.vh) {
            this.y = 0;
            this.targetY = 0;
            this.currentItem = 0;
            this.el.style.transform = "translate3d(0,0,0)";
            this.el.style.opacity = "1";
          }
        }

        // Easing: Cubic ease-in-out — pelan di awal & akhir, cepat di tengah
        _ease(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Animasi scroll dari posisi saat ini ke target
        _animateTo(target, duration, callback) {
          if (this.animating) return;
          this.animating = true;
          const startY = this.y;
          const delta = target - startY;

          if (Math.abs(delta) < 1) {
            this.animating = false;
            if (callback) callback();
            return;
          }

          let startTime = null;
          const step = (timestamp) => {
            if (!this.active) {
              this.animating = false;
              return;
            }
            if (!startTime) startTime = timestamp;

            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easedProgress = this._ease(progress);

            this.y = startY + delta * easedProgress;
            this.el.style.transform = `translate3d(0, -${this.y}px, 0)`;

            if (progress < 1) {
              // Jika mode tv optimized, pelankan simulasi ke ~30FPS untuk mendinginkan CPU
              if (document.body.classList.contains("tv-optimized")) {
                setTimeout(() => step(performance.now()), 33);
              } else {
                requestAnimationFrame(step);
              }
            } else {
              this.y = target;
              this.el.style.transform = `translate3d(0, -${this.y}px, 0)`;
              this.animating = false;
              if (callback) callback();
            }
          };
          requestAnimationFrame(step);
        }

        // Fade out → reset ke atas → fade in (loop seamless)
        _fadeResetToTop(callback) {
          // Fade out
          this.el.style.transition = "opacity 0.5s ease";
          this.el.style.opacity = "0";

          setTimeout(() => {
            // Snap ke atas (tersembunyi)
            this.y = 0;
            this.targetY = 0;
            this.currentItem = 0;
            this.el.style.transition = "none";
            this.el.style.transform = "translate3d(0, 0, 0)";

            // Force reflow
            void this.el.offsetHeight;

            // Fade in
            this.el.style.transition = "opacity 0.5s ease";
            this.el.style.opacity = "1";

            setTimeout(() => {
              this.el.style.transition = "";
              if (callback) callback();
            }, 500);
          }, 500);
        }

        // Loop utama: scroll item demi item
        _scheduleNext() {
          if (!this.active) return;
          if (this.h <= this.vh) return; // Tidak perlu scroll

          const maxScroll = this.h - this.vh;

          // Hitung berapa item yang masih bisa di-scroll
          // Cari item berikutnya yang offset-nya masih dalam batas
          let nextItem = this.currentItem + 1;

          // Pastikan ada item berikutnya
          if (nextItem < this.itemOffsets.length) {
            // Scroll ke item berikutnya — clamp ke maxScroll agar tidak overshoot
            this.currentItem = nextItem;
            // Jika item terakhir atau offset melebihi maxScroll, scroll ke maxScroll
            // agar konten paling bawah terlihat sepenuhnya
            this.targetY = Math.min(this.itemOffsets[nextItem], maxScroll);
            if (this.y >= maxScroll - 1) {
              // Sudah di posisi paling bawah, tidak perlu scroll lagi
              this.timer = setTimeout(() => {
                this._fadeResetToTop(() => {
                  this.timer = setTimeout(
                    () => this._scheduleNext(),
                    CFG.SCROLL_EDGE_PAUSE,
                  );
                });
              }, CFG.SCROLL_EDGE_PAUSE);
              return;
            }

            this._animateTo(this.targetY, CFG.SCROLL_DURATION, () => {
              // Pause setelah sampai, lalu lanjut
              this.timer = setTimeout(
                () => this._scheduleNext(),
                CFG.SCROLL_ITEM_PAUSE,
              );
            });
          } else {
            // Sudah melewati semua item — scroll ke maxScroll jika belum
            if (this.y < maxScroll - 1) {
              this._animateTo(maxScroll, CFG.SCROLL_DURATION, () => {
                this.timer = setTimeout(() => {
                  this._fadeResetToTop(() => {
                    this.timer = setTimeout(
                      () => this._scheduleNext(),
                      CFG.SCROLL_EDGE_PAUSE,
                    );
                  });
                }, CFG.SCROLL_EDGE_PAUSE);
              });
            } else {
              // Sudah di ujung bawah — pause lama, lalu fade reset
              this.timer = setTimeout(() => {
                this._fadeResetToTop(() => {
                  // Pause di atas, lalu mulai scroll lagi
                  this.timer = setTimeout(
                    () => this._scheduleNext(),
                    CFG.SCROLL_EDGE_PAUSE,
                  );
                });
              }, CFG.SCROLL_EDGE_PAUSE);
            }
          }
        }

        start() {
          // Pause awal di posisi atas sebelum mulai scroll
          this.timer = setTimeout(
            () => this._scheduleNext(),
            CFG.SCROLL_EDGE_PAUSE,
          );
        }

        reset() {
          // Bersihkan semua timer dan state
          if (this.timer) clearTimeout(this.timer);
          this.animating = false;
          this.y = 0;
          this.targetY = 0;
          this.currentItem = 0;
          if (this.el) {
            this.el.style.transition = "none";
            this.el.style.transform = "translate3d(0, 0, 0)";
            this.el.style.opacity = "1";
          }
          // Restart cycle setelah metrics diupdate
          this.timer = setTimeout(
            () => this._scheduleNext(),
            CFG.SCROLL_EDGE_PAUSE,
          );
        }
      }

        // show(title, msg, type, [icon], [duration])
        async show(title, msg, type = "info", arg4 = null, arg5 = null) {
          let duration = 8000;
          let icon = null;

          // Overload handling
          if (typeof arg4 === "number") {
            duration = arg4;
          } else if (typeof arg4 === "string") {
            icon = arg4;
            if (typeof arg5 === "number") duration = arg5;

          // Default icons
          if (!icon) {
            if (type === "success") icon = "check_circle";
            else if (type === "warn") icon = "warning";
            else if (type === "error") icon = "error";
            else if (type === "info") icon = "info";
            else if (type === "idle") icon = "notifications";
          }

          this._queue.push({ title, msg, type, icon, duration });
          this.processQueue();
        },

        async processQueue() {
          if (this._isAnimating || this._queue.length === 0) return;

          this._isAnimating = true;
          const item = this._queue.shift();

          // 1. Reset Classes
          this._el.className = `dynamic-island ${item.type}`;

          // 2. Set Content
          $("diTitle").textContent = item.title;

            iconEl.className = "material-icons-round di-icon";

          // Force layout recalc to restart transitions cleanly
          void this._el.offsetWidth;

          // 4. Expand Animation (in next frame for smoothness)
          requestAnimationFrame(() => {
            this._el.classList.add("expanded");
          });

          // 5. Wait Notification Duration
          await new Promise((r) => setTimeout(r, item.duration));

          // 5. Collapse Animation
          this._el.classList.remove("expanded");

          // 6. Cleanup & Next
          setTimeout(() => {
            this._isAnimating = false;
            this._el.className = "dynamic-island"; // Reset to base
            this.processQueue();
          }, 600); // 0.6s match CSS liquid render
        },
      };

      // Main App Logic

        },

        clock() {
          const d = new Date();

          // Cache DOM updates untuk mencegah reflow tiap detik di TV low end
          const clockVal = d.toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
          });
          const clockEl = $("clock");
          if (clockEl && clockEl.textContent !== clockVal)
            clockEl.textContent = clockVal;

          const dateVal = d
            .toLocaleDateString("id-ID", {
              weekday: "long",
              day: "numeric",
              month: "long",
            })
            .toUpperCase();
          const dateEl = $("date");
          if (dateEl && dateEl.textContent !== dateVal)
            dateEl.textContent = dateVal;

          const h = d.getHours();
          const m = d.getMinutes();
          const s = d.getSeconds();

          // Custom Rotating Notification every 5 minutes (avoid clash with break time at 12:00)
          if (m % 5 === 0 && s === 0 && h !== 12) {
            const msg = this._customMsgs[this._customMsgIdx];
            Island.show(msg.title, msg.text, "info", 6000);
            this._customMsgIdx =
              (this._customMsgIdx + 1) % this._customMsgs.length;
          }

          // Sholat Countdown Logic (15 menit sebelum masuknya waktu)
          const currentTotalMins = h * 60 + m;
          let prayCountdownActive = false;

          for (const p of this._prayTimes) {
            const prayMins = p.h * 60 + p.m;
            const diffMins = prayMins - currentTotalMins;

            // Jika berada di rentang 1 hingga 15 menit SEBELUM masuk sholat
            if (diffMins > 0 && diffMins <= 15) {
              prayCountdownActive = true;
              if (s === 0 && this._activePrayCountdown !== p.id) {
                this._activePrayCountdown = p.id;
                Island.show(
                  "Waktu Sholat",
                  `${diffMins} Menit Menuju Waktu ${p.id} 🕌`,
                  "info",
                  "access_time",
                  6000,
                );
              }

              // Hitung mundur visual di bottom left
              const remainingSeconds = 60 - s;
              const displayMins = diffMins - 1; // contoh: dif 15m, di menit 14:59 kita tampilkan 14.

              const mm = displayMins.toString().padStart(2, "0");
              const ss =
                remainingSeconds === 60
                  ? "00"
                  : remainingSeconds.toString().padStart(2, "0");
              this.status(
                `[${mm}:${ss}] MENUJU WAKTU ${p.id.toUpperCase()} 🕌`,
                true,
              );
              break;
            }
            // Tepat saat Waktu Sholat Tiba
            else if (diffMins === 0 && s === 0) {
              this._activePrayCountdown = null;
              this.status("LIVE STREAM", false);
              Island.show(
                "Waktu Sholat",
                `Waktu ${p.id} Telah Tiba 🕌`,
                "success",
                "access_time",
                8000,
              );

              // Audio dibuang sepenuhnya untuk performa memori Smart TV yang lebih baik
            }
          }

          if (!prayCountdownActive && this._activePrayCountdown) {
            this._activePrayCountdown = null;
            if (!this._isFetching) this.status("LIVE STREAM", false);
          }

          // Time-based Greetings (fire once at the exact hour)
          if (s === 0 && m === 0) {
            const key = "greet_" + h;
            if (!this._greetSent[key]) {
              this._greetSent[key] = true;
              if (h === 6) Island.show("Pagi", "Selamat Pagi 🌅", "info", 4000);
              if (h === 12)
                Island.show("Siang", "Selamat Siang ☀️", "info", 4000);
              if (h === 18)
                Island.show("Sore", "Selamat Sore 🌇", "info", 4000);
            }
          }
        },

        updateTheme() { document.documentElement.setAttribute("data-theme", "light"); return;
          const h = new Date().getHours();
          // Light Theme: 06:00 - 17:59 | Dark Theme: 18:00 - 05:59
          const isLight = h >= 6 && h < 18;
          document.documentElement.setAttribute(
            "data-theme",
            isLight ? "light" : "dark",
          );
        },

        connectRealtime() {
          const es = new EventSource("/api/stream/live");

          // Legacy/Initial snapshot (unnamed)
          es.onmessage = (e) => {
            try {
              const res = JSON.parse(e.data);
              if (res && res.doctors) this.processData(res);
            } catch (err) {
              console.error("Snapshot Error:", err);
            }
          };

          // Modern named events
          const events = ["doctors", "shifts", "leaves", "settings"];
          events.forEach((eventName) => {
            es.addEventListener(eventName, (e) => {
              try {
                const data = JSON.parse(e.data);
                this.processData({ [eventName]: data });
              } catch (err) {
                console.error(`SSE ${eventName} Error:`, err);
              }
            });
          });

          es.onerror = () => {
            Island.show(
              "Koneksi",
              "Mencoba menyambung kembali...",
              "warn",
              5000,
            );
            this.status("OFFLINE MODE", true);
          };
        },

        processData(partial) {
          if (!partial) return;
          this._data = { ...this._data, ...partial };
          const res = this._data;

          this._isFetching = true;

          try {
            const doctors = res.doctors || [];
            const shifts = res.shifts || [];
            const leaves = res.leaves || [];

            // Get today's info
            const now = new Date();
            const todayDayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1; // 0=Mon, 6=Sun
            const todayStr = now.toISOString().split("T")[0];

            // Map standard format to legacy format needed by TV UI
            const mappedData = [];

            // Helper inline untuk cek ganjil/genap
            const isShiftActiveForDate = (extra, date) => {
              if (!extra) return true;
              const weekOfMonth = Math.ceil(date.getDate() / 7);
              if (extra === 'odd_weeks' && weekOfMonth % 2 === 0) return false;
              if (extra === 'even_weeks' && weekOfMonth % 2 !== 0) return false;
              return true;
            };

            // Find shifts for today
            const todayShifts = shifts.filter(
              (s) => s.dayIdx === todayDayIdx && isShiftActiveForDate(s.extra, now)
            );

            todayShifts.forEach((shift, index) => {
              const doc = doctors.find((d) => d.id === shift.doctorId);
              if (!doc) return;

              const jamStr = shift.formattedTime || shift.title || "-";

              // Status dasar yang diputuskan server secara global untuk dokter
              let status = (doc.status || "").toUpperCase();

              // Cek apakah dokter cuti/tidak praktek hari ini
              const isLeaveToday = (shift.disabledDates || []).includes(todayStr) || 
                                   leaves.some(l => l.doctorId === doc.id && l.startDate <= todayStr && l.endDate >= todayStr);

              if (isLeaveToday) {
                status = "CUTI";
              }
              
              const isPriorityStatus = ["CUTI", "PENUH", "OPERASI"].some(s => status.includes(s));

              // --- MULTI-SHIFT BUG FIX ---
              if (jamStr !== "-") {
                const parts = jamStr.replace(/\s/g, "").replace(/\./g, ":").toLowerCase().match(/(\d{1,2}:\d{2})/g);
                if (parts && parts.length > 0) {
                  const parseMins = (t) => {
                    const [h, m] = t.split(":").map(Number);
                    return h * 60 + m;
                  };
                  const startMins = parseMins(parts[0]);
                  let endMins = null;
                  
                  if (parts.length >= 2) {
                    endMins = parseMins(parts[1]);
                    if (endMins < startMins) endMins += 24 * 60; // crossover midnight
                  } else if (jamStr.toLowerCase().includes("selesai")) {
                    endMins = startMins + 240; // Default 4 jam jika "sampai selesai"
                  }

                  let regMins = startMins - 30; // default 30 min buka loket
                  const rTime = shift.registrationTime || doc.registrationTime;
                  if (rTime && rTime !== "-") {
                    const rParts = rTime.replace(/\./g, ":").split(":");
                    if (rParts.length >= 2) regMins = Number(rParts[0]) * 60 + Number(rParts[1]);
                  }

                  const now = new Date();
                  const curMins = now.getHours() * 60 + now.getMinutes();

                  if (endMins !== null && curMins >= endMins) {
                    // Shift ini sudah sepenuhnya lewat (berlaku untuk SEMUA dokter, termasuk Cuti/Penuh/Operasi)
                    status = "SELESAI";
                  } else if (!isPriorityStatus) {
                    // Jika belum habis, dan BUKAN status prioritas, evaluasi Terjadwal/Praktek
                    if (curMins < regMins) {
                      // Shift ini belum mulai dan loket belum buka
                      status = "TERJADWAL";
                    } else {
                      // Shift sedang berjalan
                      if (!["PRAKTEK", "PENDAFTARAN"].includes(status)) {
                         status = "PRAKTEK";
                      }
                    }
                  }
                }
              }

              mappedData.push({
                Dokter: doc.name,
                Spesialis: doc.specialty,
                Status: status,
                Jam: jamStr,
                JamPraktek: jamStr,
                JamDaftar:
                  shift.registrationTime || doc.registrationTime || "-",
                Jenis: doc.category,
                "Code Antrian": doc.queueCode,
                _shiftId: shift.id || index,
              });
            });

            // Detect doctor status changes before render
            this._detectChanges(mappedData);

            this.render(mappedData);
            this.status("LIVE STREAM", false);
          } catch (e) {
            console.error("TV ProcessData Error:", e);
            Island.show(
              "Data Error",
              "Gagal memproses data realtime",
              "error",
              8000,
            );
          } finally {
            this._isFetching = false;
          }
        },

        _detectChanges(data) {
          if (!data) return;
          const now = {}; // { status: string, active: boolean }
          const ops = [];

          data.forEach((d) => {
            const name = (d.Dokter || "").trim();
            const st = (d.Status || "").toUpperCase();
            // Gunakan kombinasi nama + shift sebagai key agar dokter multi-shift dilacak terpisah
            const key = `${name}_${d._shiftId || d.Jam || ""}`;
            // Active logic: Inside time AND (BUKA or PENUH)
            const isNowActive = isActive(st);

            // Daftarkan ke list Ruang Operasi jika cocok
            if (st.includes("OPERASI")) ops.push(name);

            const prev = this._prevDoctors[key]; // { status, active } or undefined

            // Store current state
            now[key] = { status: st, active: isNowActive };

            if (prev && prev.status !== st) {
              if (st === "PENDAFTARAN") {
                Island.show("Loket Dibuka", `Pendaftaran poli ${name} telah dimulai`, "info", "assignment", 8000);
              } else if (st === "PRAKTEK") {
                Island.show("Praktek Dimulai", `${name} Mulai Melayani Pasien`, "success", "door_front", 8000);
              } else if (st === "PENUH") {
                 Island.show("Kuota Penuh", `Poli ${name} telah memenuhi kuota maksimal`, "warn", "front_hand", 10000);
              } else if (st === "SELESAI") {
                 Island.show("Praktek Selesai", `Pelayanan ${name} telah purna`, "info", "check_circle", 8000);
              } else if (st === "OPERASI") {
                 Island.show("Tindakan Operasi", `${name} sedang dalam tindakan operasi`, "warn", "local_hospital", 10000);
              }
            }
          });

          this._operasiDoctors = ops;
          this._prevDoctors = now;
        },

        _lastBroadcastId: null, // Track to avoid re-rendering same popup

        async checkBroadcast() {
          try {
            const res = await fetch("/api/automation");
            if (!res.ok) return; // Silent guard
            const rules = await res.json();

            // Filter rules that are active (assuming the backend returns true boolean)
            const active = rules.find(
              (r) => r.active === true || r.active === 1 || r.active === "true",
            );
            const overlay = $("broadcastOverlay");
            if (!overlay) return;

            if (active) {
              // Only update DOM if broadcast changed
              if (this._lastBroadcastId !== active.id) {
                this._lastBroadcastId = active.id;

                // Stop any closing animation if it was happening
                overlay.classList.remove("closing");

                // Set level class on overlay
                overlay.className = `broadcast-overlay active broadcast-level-${active.alertLevel}`;

                // Icon
                const iconMap = {
                  Information: "info",
                  Warning: "warning",
                  Critical: "error",
                };
                const iconEl = overlay.querySelector(
                  ".broadcast-icon-ring .material-icons-round",
                );
                if (iconEl)
                  iconEl.textContent = iconMap[active.alertLevel] || "campaign";

                // Label
                const labelEl = $("broadcastLevelLabel");
                if (labelEl)
                  labelEl.textContent = active.alertLevel.toUpperCase();

                // Message
                const msgEl = $("broadcastMessage");
                if (msgEl) msgEl.textContent = active.message;

                // Zone
                const zoneEl = $("broadcastZone");
                if (zoneEl)
                  zoneEl.textContent =
                    active.targetZone.replace("_", " ") +
                    " • " +
                    active.duration +
                    " menit";

                // Also show on Dynamic Island (debounce/protect multiple calls)
                Island.show(
                  "EMERGENCY BROADCAST",
                  active.message,
                  active.alertLevel === "Critical" ? "error" : "warn",
                  "campaign",
                  10000,
                );
              }
            } else {
              // No active broadcast — hide overlay with animation
              if (
                overlay.classList.contains("active") &&
                !overlay.classList.contains("closing")
              ) {
                this._lastBroadcastId = null;
                overlay.classList.add("closing");

                // Wait for CSS animation to finish before removing 'active' class (display:none)
                setTimeout(() => {
                  // Double check if it wasn't re-activated during the closing animation
                  if (overlay.classList.contains("closing")) {
                    overlay.classList.remove("active", "closing");
                    // Reset class back to base to purge level colors
                    overlay.className = "broadcast-overlay";
                  }
                }, 450); // Slightly larger than the 0.4s animation duration
              }
            }
          } catch (e) {
            console.error("Broadcast check failed:", e);
          }
        },

        updateInfoBox() {

          el.style.opacity = "0";

        status(msg, warn) {
          const elTxt = $("liveText");
          if (elTxt && elTxt.textContent !== msg) elTxt.textContent = msg;

          const elDot = $("liveDot");
          const newClass = warn ? "live-dot warn" : "live-dot";

        },

        render(data) {
          if (!data) return;

          // 0. Calculate Stats
          let countBuka = 0,
            countPenuh = 0,
            countCuti = 0;
          data.forEach((d) => {
            const s = (d.Status || "").toUpperCase();
            if (["PRAKTEK", "PENDAFTARAN", "TERJADWAL"].includes(s)) countBuka++;
              else if (s === "PENUH") countPenuh++;
            else if (s.includes("CUTI")) countCuti++;
          });
          $("statBuka").textContent = countBuka;
          $("statPenuh").textContent = countPenuh;
          $("statCuti").textContent = countCuti;

          const group = { Bedah: [], NonBedah: [], Sidebar: [] };

          // 1. ACTIVE List (Main Display) - Exclude Penuh, Cuti, Selesai, Tidak Praktek, Operasi
          const mainData = data.filter((d) => {
            const s = (d.Status || "").toUpperCase();
            if (
              s.includes("SELESAI") ||
              s.includes("TIDAK") ||
              s.includes("LIBUR")
            )
              return false;
            // Move Penuh, Cuti, Operasi to Sidebar
            if (
              s.includes("PENUH") ||
              s.includes("CUTI") ||
              s.includes("OPERASI")
            )
              return false;
            return true;
          });

          // 2. SIDEBAR List - Only Penuh, Cuti, Operasi
          const sidebarData = data.filter((d) => {
            const s = (d.Status || "").toUpperCase();
            if (
              s.includes("SELESAI") ||
              s.includes("TIDAK") ||
              s.includes("LIBUR")
            )
              return false;
            return (
              s.includes("PENUH") || s.includes("CUTI") || s.includes("OPERASI")
            );
          });

          [...mainData, ...sidebarData].forEach((d) => {
            const s = (d.Status || "").toUpperCase();
            d._isActive = isActive(s);
          });

          // Sorting: AKTIF (Top) -> PRAKTEK/PNDF (4) -> PENUH (3) -> TERJADWAL (2.5) -> OPERASI (2) -> CUTI (1)
          const score = (s) => {
            const u = s.toUpperCase();
            if (["PRAKTEK", "PENDAFTARAN"].includes(u)) return 4;
            if (u.includes("PENUH")) return 3;
            if (u === "TERJADWAL") return 2.5;
            if (u.includes("OPERASI")) return 2;
            if (u.includes("CUTI")) return 1;
            return 0;
          };

          const sortFn = (a, b) => {
            // Priority 1: Active
            if (a._isActive && !b._isActive) return -1;
            if (!a._isActive && b._isActive) return 1;
            // Priority 2: Status Score
            const diff = score(b.Status) - score(a.Status);
            if (diff !== 0) return diff;
            // Priority 3: Specialty (Poliklinik)
            if (a.Spesialis < b.Spesialis) return -1;
            if (a.Spesialis > b.Spesialis) return 1;
            // Priority 4: Doctor Name
            if (a.Dokter < b.Dokter) return -1;
            if (a.Dokter > b.Dokter) return 1;
            return 0;
          };

          mainData.sort(sortFn);
          sidebarData.sort(sortFn);

          // Group Main Data
          mainData.forEach((d) => {
            const g = d.Jenis === "Bedah" ? "Bedah" : "NonBedah";
            if (group[g]) group[g].push(d);
          });

          // Group Sidebar Data — terpisah per status
          group.SidebarOperasi = sidebarData.filter((d) =>
            (d.Status || "").toUpperCase().includes("OPERASI"),
          );
          group.SidebarPenuh = sidebarData.filter((d) =>
            (d.Status || "").toUpperCase().includes("PENUH"),
          );
          group.SidebarCuti = sidebarData.filter((d) =>
            (d.Status || "").toUpperCase().includes("CUTI"),
          );

          // --- DOM RECYCLING ENGINE ---
          const updateList = (containerId, list) => {
            const container = $(containerId);
            
            // Handle Empty State 3D Animation
            if (list.length === 0) {
              const emptyStateHTML = `
                <div class="neo-empty-state">
                  <div class="neo-orb"></div>
                  <div class="neo-empty-text">TIDAK ADA JADWAL</div>
                </div>
              `;
              if (container.innerHTML !== emptyStateHTML) {
                container.innerHTML = emptyStateHTML;
                return true; // signal scroller refresh
              }
              return false;
            }

            const oldMap = new Map();
            // Map existing elements by Doctor Name
            Array.from(container.children).forEach((el) => {
              if (el.dataset.id) oldMap.set(el.dataset.id, el);
            });

            let hasLayoutChange = false;
            const newElements = list.map((d) => {
              // Unique ID: Name + Shift Time so duplicate doctors don't overwrite each other
              const shiftJam = d.Jam && d.Jam !== "-" ? d.Jam : "no-time";
              const id = `${d.Dokter}_${shiftJam}`;
              const hash = `${d.Status}|${d.Jam}|${d._isActive}|${d["Code Antrian"] || ""}|${d.JamDaftar}`;

              // Helpers for styles
              const st = d.Status.toUpperCase();
              let c = "st-nopoli",
                i = "block",
                l = d.Status;
              if (st === "PRAKTEK" || st === "PENDAFTARAN") {
                c = "st-buka";
                i = "check_circle";
                l = "BUKA";
              } else if (st === "TERJADWAL") {
                c = "st-buka st-terjadwal";
                i = "schedule";
                l = "TERJADWAL";
              } else if (st.includes("PENUH")) {
                c = "st-penuh";
                i = "front_hand";
                l = "PENUH";
              } else if (st.includes("OPERASI")) {
                c = "st-operasi";
                i = "local_hospital";
                l = "OPERASI";
              } else if (st.includes("CUTI")) {
                c = "st-cuti";
                i = "flight";
                l = "CUTI";
              }
              const avatarIcon = getSpecialistIcon(d.Spesialis);
              const avatarText = avatarIcon.startsWith("<svg") ? avatarIcon : `<span class="material-icons-round" style="font-size:24px;">${avatarIcon}</span>`;
              if (d._isActive) c += " active";

              let labelJam = "REGISTRASI DIBUKA";
              let labelLive = "SEDANG MELAYANI";
              if (st.includes("OPERASI")) {
                labelJam = "TINDAKAN MEDIS";
                labelLive = "SEDANG OPERASI";
              } else if (st.includes("PENUH")) {
                labelJam = "STATUS KUOTA";
                labelLive = "TELAH PENUH";
              } else if (st.includes("CUTI")) {
                labelJam = "JADWAL CUTI";
                labelLive = "TIDAK MELAYANI";
              } else if (st === "TERJADWAL") {
                labelJam = "MENUNGGU SHIFT";
                labelLive = "BELUM MULAI";
              }


              let el = oldMap.get(id);

              if (el) {
                // RECYCLE: Only update if Hash changed
                if (el.dataset.hash !== hash) {
                  el.className = `platter ${c}`;

                  // IN-PLACE DOM Update (Menghindari innerHTML untuk performa)
                  const dName = el.querySelector(".doc-name");
                  if (dName) dName.textContent = d.Dokter;

                  const dSpec = el.querySelector(".doc-spec");
                  if (dSpec) dSpec.textContent = d.Spesialis.toUpperCase();

                  const stPill = el.querySelector(".status-pill");
                  if (stPill) {
                    stPill.style.background = `var(--status-bg)`;
                    stPill.style.color = `var(--status-color)`;
                    stPill.innerHTML = `<span class="material-icons-round" style="font-size:12px">${i}</span>${l}`;
                  }

                  const jValDaftar = el.querySelector(".jam-val-daftar");
                  if (jValDaftar)
                    jValDaftar.textContent =
                      d.JamDaftar !== "-"
                        ? d.JamDaftar
                        : formatJam(d.JamPraktek.split("-")[0]);

                  const jValPraktek = el.querySelector(".jam-val-praktek");
                  if (jValPraktek && d.JamPraktek)
                    jValPraktek.textContent = d.JamPraktek;

                  const dtTime = el.querySelector(".detail-time");
                  if (dtTime)
                    dtTime.textContent =
                      d.JamDaftar !== "-"
                        ? d.JamDaftar
                        : formatJam(d.JamPraktek.split("-")[0]);

                  const dtLabel = el.querySelector(".detail-label");
                  if (dtLabel) dtLabel.textContent = labelJam;

                  const lText = el.querySelector(".live-text");
                  if (lText) lText.textContent = labelLive;

                  el.dataset.hash = hash;
                }
                // Hapus class animasi lama
                el.classList.remove("platter-new");
                oldMap.delete(id); // Mark handled
              } else {
                // CREATE: New element dengan animasi slide-in
                el = document.createElement("div");
                el.className = `platter ${c} platter-new`;
                el.dataset.id = id;
                el.dataset.hash = hash;
                el.innerHTML = buildCardHTML(d, avatarText, i, l, labelJam, labelLive);

                hasLayoutChange = true;
                // Hapus class animasi setelah selesai
                el.addEventListener(
                  "animationend",
                  () => el.classList.remove("platter-new"),
                  { once: true },
                );
              }
              return el;
            });

            // If items removed, we need layout update
            if (oldMap.size > 0) hasLayoutChange = true;

            // Check if order changed
            if (!hasLayoutChange) {
              for (let i = 0; i < newElements.length; i++) {
                if (container.children[i] !== newElements[i]) {
                  hasLayoutChange = true;
                  break;
                }
              }
            }

            // Apply to DOM only if structural change occurred
            if (hasLayoutChange) {
              container.replaceChildren(...newElements);
              return true; // Signal scroller to reset
            }

            return false; // No scroll reset needed
          };

          const changed1 = updateList("scrollBedah", group.Bedah);
          const changed2 = updateList("scrollNonBedah", group.NonBedah);

          // --- SIDEBAR: Grouped Render (OPERASI + PENUH + CUTI terpisah) ---
          const changed3 = this._renderSidebar(
            group.SidebarOperasi,
            group.SidebarPenuh,
            group.SidebarCuti,
            updateList,
          );

          $("countBedah").textContent = group.Bedah.length;
          $("countNonBedah").textContent = group.NonBedah.length;
          $("countSidebar").textContent =
            group.SidebarPenuh.length + group.SidebarCuti.length;

          // Only reset scroller if list structure changed (avoid jumpiness on simple updates)
          if (!isMobile) {
            if (changed1) {
              s1.reset();
              requestAnimationFrame(() => s1.updateMetrics());
            }
            if (changed2) {
              s2.reset();
              requestAnimationFrame(() => s2.updateMetrics());
            }
            if (changed3) {
              s3.reset();
              requestAnimationFrame(() => s3.updateMetrics());
            }
          }
        },

        // Render sidebar dengan section header terpisah
        _renderSidebar(operasiList, penuhList, cutiList, updateList) {
          const container = $("scrollSidebar");
          const oldMap = new Map();
          Array.from(container.children).forEach((el) => {
            if (el.dataset.id) oldMap.set(el.dataset.id, el);
          });

          const allElements = [];
          let hasLayoutChange = false;

          // Helper: Buat section header
          const makeSectionHeader = (label, color, count, id) => {
            let el = container.querySelector(`[data-section="${id}"]`);
            if (!el) {
              el = document.createElement("div");
              el.className = "sidebar-section-header";
              el.dataset.section = id;
              hasLayoutChange = true;
            }
            el.innerHTML = `
                        <div class="sidebar-section-dot" style="background:${color}"></div>
                        <span class="sidebar-section-label">${label}</span>
                        <div class="sidebar-section-line"></div>
                        <span class="sidebar-section-count">${count}</span>
                    `;
            return el;
          };

          // Helper: Buat platter card (reuse dari updateList logic)
          const makeCard = (d) => {
            // Unique ID: Name + Shift Time
            const shiftJam = d.Jam && d.Jam !== "-" ? d.Jam : "no-time";
            const id = `${d.Dokter}_${shiftJam}`;
            const hash = `${d.Status}|${d.Jam}|${d._isActive}|${d["Code Antrian"] || ""}|${d.JamDaftar}`;
            const st = d.Status.toUpperCase();
            let c = "st-nopoli", i = "block", l = d.Status;
            if (st === "PRAKTEK") { c = "st-praktek"; i = "check_circle"; l = "PRAKTEK"; }
            else if (st === "PENDAFTARAN") { c = "st-pendaftaran"; i = "assignment"; l = "PENDAFTARAN"; }
            else if (st === "TERJADWAL") { c = "st-terjadwal"; i = "schedule"; l = "TERJADWAL"; }
            else if (st === "SELESAI") { c = "st-selesai"; i = "done_all"; l = "SELESAI"; }
            else if (st === "PENUH") { c = "st-penuh"; i = "front_hand"; l = "PENUH"; }
            else if (st === "OPERASI") { c = "st-operasi"; i = "local_hospital"; l = "OPERASI"; }
            else if (st === "CUTI") { c = "st-cuti"; i = "flight"; l = "CUTI"; }
            else if (st === "LIBUR") { c = "st-libur"; i = "block"; l = "LIBUR"; }
            const avatarIcon = getSpecialistIcon(d.Spesialis);
            const avatarText = avatarIcon.startsWith("<svg") ? avatarIcon : `<span class="material-icons-round" style="font-size:24px;">${avatarIcon}</span>`;
            if (d._isActive) c += " active";

            let labelJam = "REGISTRASI DIBUKA";
            let labelLive = "SEDANG MELAYANI";
            if (st.includes("OPERASI")) {
              labelJam = "TINDAKAN MEDIS";
              labelLive = "SEDANG OPERASI";
            } else if (st.includes("PENUH")) {
              labelJam = "STATUS KUOTA";
              labelLive = "TELAH PENUH";
            } else if (st.includes("CUTI")) {
              labelJam = "JADWAL CUTI";
              labelLive = "TIDAK MELAYANI";
            } else if (st === "TERJADWAL") {
              labelJam = "MENUNGGU SHIFT";
              labelLive = "BELUM MULAI";
            }

            let el = oldMap.get(id);

            if (el) {
              if (el.dataset.hash !== hash) {
                el.className = `platter platter-mini ${c}`;

                // IN-PLACE DOM Update Sidebar
                const dName = el.querySelector(".doc-name");
                if (dName) dName.textContent = d.Dokter;

                const dSpec = el.querySelector(".doc-spec");
                if (dSpec) dSpec.textContent = d.Spesialis.toUpperCase();

                const stPill = el.querySelector(".status-pill");
                if (stPill) {
                  stPill.style.background = `var(--status-bg)`;
                  stPill.style.color = `var(--status-color)`;
                  stPill.innerHTML = `<span class="material-icons-round" style="font-size:12px">${i}</span>${l}`;
                }

                const jValDaftar = el.querySelector(".jam-val-daftar");
                if (jValDaftar)
                  jValDaftar.textContent =
                    d.JamDaftar !== "-"
                      ? d.JamDaftar
                      : formatJam(d.JamPraktek.split("-")[0]);

                const jValPraktek = el.querySelector(".jam-val-praktek");
                if (jValPraktek && d.JamPraktek)
                  jValPraktek.textContent = d.JamPraktek;

                const dtTime = el.querySelector(".detail-time");
                if (dtTime)
                  dtTime.textContent =
                    d.JamDaftar !== "-"
                      ? d.JamDaftar
                      : formatJam(d.JamPraktek.split("-")[0]);

                const dtLabel = el.querySelector(".detail-label");
                if (dtLabel) dtLabel.textContent = labelJam;

                const lText = el.querySelector(".live-text");
                if (lText) lText.textContent = labelLive;

                el.dataset.hash = hash;
              }
              el.classList.remove("platter-new");
              oldMap.delete(id);
            } else {
              el = document.createElement("div");
              el.className = `platter platter-mini ${c} platter-new`;
              el.dataset.id = id;
              el.dataset.hash = hash;
              el.innerHTML = buildSidebarCardHTML(d, avatarText, i, l);
              hasLayoutChange = true;
              el.addEventListener(
                "animationend",
                () => el.classList.remove("platter-new"),
                { once: true },
              );
            }
            return el;
          };

          // --- Build grouped layout ---
          if (operasiList.length > 0) {
            allElements.push(
              makeSectionHeader(
                "Tindakan Operasi",
                "#BF5AF2",
                operasiList.length,
                "sec-operasi",
              ),
            );
            operasiList.forEach((d) => allElements.push(makeCard(d)));
          }

          if (penuhList.length > 0) {
            allElements.push(
              makeSectionHeader(
                "Kuota Penuh",
                "#FF9F0A",
                penuhList.length,
                "sec-penuh",
              ),
            );
            penuhList.forEach((d) => allElements.push(makeCard(d)));
          }

          if (cutiList.length > 0) {
            allElements.push(
              makeSectionHeader(
                "Sedang Cuti",
                "#FF453A",
                cutiList.length,
                "sec-cuti",
              ),
            );
            cutiList.forEach((d) => allElements.push(makeCard(d)));
          }

          // Deteksi perubahan
          if (oldMap.size > 0) hasLayoutChange = true;
          if (!hasLayoutChange) {
            const currentChildren = Array.from(container.children);
            if (currentChildren.length !== allElements.length) {
              hasLayoutChange = true;
            } else {
              for (let i = 0; i < allElements.length; i++) {
                if (currentChildren[i] !== allElements[i]) {
                  hasLayoutChange = true;
                  break;
                }
              }
            }
          }

          if (hasLayoutChange) {
            container.replaceChildren(...allElements);
            return true;
          }
          return false;
        },
      };

      App.init();
    </script>
  </body>
</html>
