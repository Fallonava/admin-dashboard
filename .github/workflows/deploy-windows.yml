name: Deploy to Stable Server (Windows)

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-windows
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to C:\simed-production
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      PM2_HOME: 'C:\Users\ANTRIAN 1\.pm2'
      PROD_DIR: 'C:\simed-production'
      NODE_NO_WARNINGS: '1'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      PATH: 'C:\Users\ANTRIAN 1\AppData\Roaming\npm;C:\Program Files\nodejs;C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem'

    steps:
      # ── Step 0: Safe Pre-Cleanup ─────────────────────────────────────────────
      - name: Safe Process & Lock Cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Write-Host "Membersihkan proses gantung & lock..."

          # Hanya matikan proses zombie di folder workspace runner (_work)
          # JANGAN pernah mematikan proses node di C:\simed-production atau PM2!
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { 
            $_.Path -like "*_work*" 
          } | Stop-Process -Force -ErrorAction SilentlyContinue

          Get-Process git -ErrorAction SilentlyContinue | Where-Object { 
            $_.Path -like "*_work*" 
          } | Stop-Process -Force -ErrorAction SilentlyContinue

          # Matikan zombie chrome (Puppeteer)
          taskkill /F /IM chrome.exe /T 2>$null

          # Hapus semua file lock git jika ada
          Get-ChildItem -Path ".git" -Filter "*.lock" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

          Write-Host "Pembersihan aman selesai."
          exit 0

      # ── Step 1: Self-Healing Native Git Sync (Bypass actions/checkout) ────────
      - name: Self-Healing Git Sync
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          git config --global --add safe.directory "*"
          git config --global core.longpaths true

          $repoUrl = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if (-not (Test-Path ".git")) {
            Write-Host "Clone repositori baru..."
            git clone $repoUrl .
          } else {
            Write-Host "Sinkronisasi repositori..."
            git remote set-url origin $repoUrl
            git fetch origin master --prune
            git reset --hard origin/master
            git clean -fd
          }

          Write-Host "Git Sync sukses. Commit aktif:"
          git log -1 --oneline

      # ── Step 2: Create .env ──────────────────────────────────────────────────
      - name: Create Server Environment (.env)
        shell: powershell
        run: |
          $lines = @(
            'DATABASE_URL=postgresql://medcore:medcore_local_password@localhost:5432/medcoredb?sslmode=disable',
            'DIRECT_URL=postgresql://medcore:medcore_local_password@localhost:5432/medcoredb?sslmode=disable',
            'PGHOST=localhost',
            'PGUSER=medcore',
            'PGDATABASE=medcoredb',
            'PGPASSWORD=medcore_local_password',
            'ADMIN_KEY=dev_key_123',
            'NEXT_PUBLIC_ADMIN_KEY=dev_key_123',
            'CRON_SECRET=siaga_medika_secret_2024',
            'JWT_SECRET=mc_jwt_k3y!S1ag4M3d1k4_2024_secure_t0ken_s3cr3t',
            'NEXT_PUBLIC_APP_URL=https://simed.fallonava.my.id',
            'HOSTNAME=0.0.0.0',
            'NODE_ENV=production',
            'PORT=3000',
            'AGENT_EXEC_TOKEN=ac-7928-df91-4e8a-8db4-314a4d467736-mc-secure-gate-2026-gravity'
          )
          $lines | Set-Content -Path ".env" -Encoding UTF8
          Write-Host ".env berhasil dibuat."

      # ── Step 3: Install Dependencies ────────────────────────────────────────
      - name: Install Dependencies
        shell: powershell
        run: |
          $ProgressPreference = "SilentlyContinue"
          npm ci
          Write-Host "npm ci selesai."

      # ── Step 4: Generate Prisma Client & Migrate ────────────────────────────
      - name: Sync Database & Generate Client
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Menjalankan Prisma Generate..."
          npx prisma generate

          Write-Host "Menjalankan Database Migration..."
          try {
            npx prisma migrate deploy
            Write-Host "Database migration selesai."
          } catch {
            Write-Warning "Prisma migrate deploy gagal. Mencoba sync via db push..."
            npx prisma db push --skip-generate
          }

      # ── Step 5: Build Application ────────────────────────────────────────────
      - name: Build Application
        shell: powershell
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          npm run build
          Write-Host "Build Next.js selesai sukses."

      # ── Step 6: Prepare Production Directory ─────────────────────────────────
      - name: Prepare Production Directory
        shell: powershell
        run: |
          $ProdDir = $env:PROD_DIR
          if (-not (Test-Path $ProdDir)) {
            New-Item -ItemType Directory -Path $ProdDir -Force | Out-Null
            Write-Host "Direktori $ProdDir dibuat."
          }
          if (-not (Test-Path "$ProdDir\logs")) {
            New-Item -ItemType Directory -Path "$ProdDir\logs" -Force | Out-Null
          }
          if (-not (Test-Path "$ProdDir\sessions")) {
            New-Item -ItemType Directory -Path "$ProdDir\sessions" -Force | Out-Null
          }

      # ── Step 7: Robocopy Build → Production (Zero-Downtime Sync) ────────────
      - name: Sync Files to Production Directory
        shell: powershell
        run: |
          $Src = $env:GITHUB_WORKSPACE
          $Dst = $env:PROD_DIR
          
          # /MIR = Mirror
          # /XD = Exclude direktori agar WA Sessions, Logs, & Git tidak terhapus
          # /XF = Exclude file agar .env, locked runtime binaries (*.node, *.dll), & log tidak ditimpa
          robocopy $Src $Dst /MIR /XD .git .github sessions logs /XF .env .wa-status.json *.node *.dll *.log /R:2 /W:1 /NP /NFL /NJH /NDL
          
          # Robocopy Bitmask: <= 7 = Murni sukses; 8..11 = Sukses dengan locked binaries tetap aman di memori
          if ($LASTEXITCODE -le 11) {
            Write-Host "Robocopy selesai sukses (exit code: $LASTEXITCODE)"
            exit 0
          } else {
            Write-Error "Robocopy GAGAL dengan exit code fatal: $LASTEXITCODE"
            exit 1
          }

      # ── Step 8: Optimize Global PM2 (Logrotate) ──────────────────────────────
      - name: Optimize Global PM2 (Logrotate)
        shell: cmd
        run: |
          set PM2_HOME=C:\Users\ANTRIAN 1\.pm2
          echo Mengonfigurasi pm2-logrotate...
          call pm2.cmd list | findstr "pm2-logrotate" > nul
          if errorlevel 1 (
            echo Memasang pm2-logrotate...
            call pm2.cmd install pm2-logrotate
          )
          call pm2.cmd set pm2-logrotate:max_size 10M
          call pm2.cmd set pm2-logrotate:retain 7
          call pm2.cmd set pm2-logrotate:compress true
          call pm2.cmd set pm2-logrotate:workerInterval 60
          echo Logrotate siap.

      # ── Step 9: Zero-Downtime Rolling Reload ─────────────────────────────────
      - name: Zero-Downtime Rolling Reload
        shell: powershell
        run: |
          $env:PM2_HOME = "C:\Users\ANTRIAN 1\.pm2"
          $ProdDir = $env:PROD_DIR
          Set-Location $ProdDir

          Write-Host "Mengecek status PM2 untuk Zero-Downtime Rolling Reload..."
          $ErrorActionPreference = "Continue"

          $pm2List = cmd.exe /c "pm2 list"
          if ($pm2List -match "admin-dashboard") {
            Write-Host "🔄 Melakukan Rolling Reload (0 detik downtime)..."
            & pm2.cmd reload ecosystem.config.js --update-env
          } else {
            Write-Host "🚀 Menjalankan PM2 Cluster baru dari $ProdDir..."
            & pm2.cmd start ecosystem.config.js --update-env
          }
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PM2 reload/start GAGAL dengan exit code $LASTEXITCODE."
            exit 1
          }
          
          & pm2.cmd save --force
          Write-Host "State PM2 disimpan."

      # ── Step 10.5: Windows Boot Resilience (Anti-Padam Listrik) ──────────────
      - name: Configure Auto-Start on System Boot
        shell: powershell
        run: |
          Write-Host "Mengonfigurasi layanan otomatis saat komputer booting..."
          $ErrorActionPreference = "SilentlyContinue"

          # 1. Pastikan Service Windows kritis otomatis menyala saat boot
          Set-Service -Name "cloudflared" -StartupType Automatic 2>$null
          Set-Service -Name "postgresql*" -StartupType Automatic 2>$null

          # 2. Buat file batch launcher startup
          $StartupScript = "C:\simed-production\auto_resurrect.bat"
          $ScriptLines = @(
            '@echo off',
            'set PM2_HOME=C:\Users\ANTRIAN 1\.pm2',
            'timeout /t 10 /nobreak > nul',
            'call pm2.cmd resurrect'
          )
          $ScriptLines | Set-Content -Path $StartupScript -Encoding ASCII

          # 3. Daftarkan Scheduled Task level SYSTEM (AtStartup)
          try {
            $Action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c C:\simed-production\auto_resurrect.bat"
            $Trigger = New-ScheduledTaskTrigger -AtStartup
            $Principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
            $Settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries

            Register-ScheduledTask -TaskName "PM2_Simed_AutoResurrect_OnBoot" -Action $Action -Trigger $Trigger -Principal $Principal -Settings $Settings -Force | Out-Null
            Write-Host "✅ Windows Task Scheduler 'PM2_Simed_AutoResurrect_OnBoot' berhasil dikonfigurasi!"
          } catch {
            Write-Host "Pendaftaran task via schtasks fallback..."
            schtasks /create /tn "PM2_Simed_AutoResurrect_OnBoot" /tr "cmd.exe /c C:\simed-production\auto_resurrect.bat" /sc onstart /ru SYSTEM /rl HIGHEST /f 2>$null
          }

      # ── Step 11: Service Health Checks ───────────────────────────────────────
      - name: Paksa Nyalakan Cloudflare Tunnel
        shell: powershell
        run: |
          try {
            Start-Service -Name "cloudflared" -ErrorAction Stop
            Write-Host "Service cloudflared aktif."
          } catch {
            Write-Host "Service cloudflared sudah aktif atau tidak ditemukan."
          }

      # ── Step 12: Verify Deployment ───────────────────────────────────────────
      - name: Verify Deployment
        shell: powershell
        run: |
          $env:PM2_HOME = "C:\Users\ANTRIAN 1\.pm2"
          Start-Sleep -Seconds 5
          
          $pm2Status = cmd.exe /c "pm2 list"
          Write-Host $pm2Status
          
          $errored = $pm2Status | Select-String "errored"
          if ($errored) {
            Write-Error "ADA PROSES YANG ERROR DI PM2!"
            exit 1
          }
          
          $adminExists = $pm2Status | Select-String "admin-dashboard"
          if (-not $adminExists) {
            Write-Error "admin-dashboard tidak ditemukan di PM2!"
            exit 1
          }
          
          Write-Host "✅ Deployment sukses 100%! Semua proses berjalan."
          exit 0

      # ── Step 13: Diagnostic on Failure ────────────────────────────────────────
      - name: Diagnostic on Failure
        if: failure()
        shell: powershell
        run: |
          $env:PM2_HOME = "C:\Users\ANTRIAN 1\.pm2"
          $ProdDir = $env:PROD_DIR
          Write-Host "❌ Deployment GAGAL! Mengambil log eror..."

          Write-Host "--- [PM2 STATUS] ---"
          cmd.exe /c "pm2 list"

          Write-Host "--- [ADMIN ERROR LOG] ---"
          if (Test-Path "$ProdDir\logs\admin-error.log") {
            Get-Content "$ProdDir\logs\admin-error.log" -Tail 50
          }

          Write-Host "--- [WA-WORKER ERROR LOG] ---"
          if (Test-Path "$ProdDir\logs\wa-worker-error.log") {
            Get-Content "$ProdDir\logs\wa-worker-error.log" -Tail 50
          }
